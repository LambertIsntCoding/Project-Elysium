# Runtime configuration for the Active/Sleep lifecycle, the background
# scheduler, proactive communication, filesystem organization, Discord and
# voice.
#
# HARD SAFETY BOUNDARIES ARE ENFORCED IN CODE, NOT HERE. This file tunes
# behaviour; it cannot widen the safety guarantees. In particular:
#   * a file outside `allowed_roots` is refused, and an empty `allowed_roots`
#     means nothing is autonomously writable;
#   * Astra's own runtime/storage/config paths are protected in code and can
#     never be added back as writable;
#   * deletion never permanently unlinks - it goes to the OS/XDB trash - and
#     `allow_delete` defaults to false, so autonomous deletion is off.
# This file is optional: with no file, or an unparseable one, the safe defaults
# below are used.

runtime:
  scheduler:
    enabled: true
    # Bounded work per cycle. A cycle may legitimately do nothing.
    max_tasks_per_cycle: 3
    cycle_budget_seconds: 5.0
    task_budget_seconds: 3.0
  # How often the background worker wakes while asleep. Must stay >= 1s.
  poll_seconds: 5.0
  # Headless idle policy: with no console and no interaction for this long, the
  # runtime moves itself to SLEEP so the sleep-only opportunistic work gets a
  # turn. A human message always wakes her. 0 disables the policy.
  idle_sleep_seconds: 30.0
  # Power and resources: measured, numeric awareness of the machine (see
  # astra/machine.py). Nothing here is a guess; an unmeasurable value simply
  # changes no decision.
  power:
    # Run conservatively at startup (only light work) until the machine has been
    # up long enough and is measurably calm. This is the energy-efficient boot
    # mode, not a personality setting.
    startup_efficiency: true
    # If the machine suspends, Astra sleeps alongside it rather than treating the
    # gap as active time (the gap is detected from the machine's own uptime).
    sleep_with_computer: true
    # Opt-in only: on resume, wake to ACTIVE automatically. Default false keeps
    # the least presumptuous behaviour (she stays asleep until spoken to).
    wake_on_resume: false

# Whether the language model may be invoked, and for what. Astra is not the
# model: the model is her *voice*, and it should only be active when it is
# actually doing a job - never simply because the program is running.
#
#   conversation   live turn: composing the reply to Roum          (default on)
#   consolidation  extracting governed memories from that turn    (default on)
#   elysium        structuring an explicitly-requested command     (default on)
#   reading        the *background* reader summarising a book while Roum is away
#                  (where she forms her own view on parts of a book) (RELEASE: ON)
#
# `reading` is the only one that runs the model while Roum is not interacting.
# For this release it is ON: autonomous reading has been verified to run only
# when Roum is idle and the machine is calm (never against a running game, a
# busy task, or a cold/loaded machine), to respect the existing load/concurrency
# budgets, to hold its position on a failed model call rather than skipping a
# passage, and to file what it extracts as governed memories. It runs only when
# a book is queued, so with an empty library it stays inactive. Set it to false
# to stop the background model calls entirely; an explicit /read always works and
# the deterministic Library is always built.
model_use:
  conversation: true
  consolidation: true
  elysium: true
  proactive_compose: true
  reading: true

# Autonomous operation: time-aware schedules, bounded activity planning, and
# proactive delivery. This is the headless brain; it runs whether or not a
# console is open.
autonomy:
  enabled: true
  # How often the autonomy driver runs one bounded wake.
  wake_interval_seconds: 30.0
  # Planning: Astra may select bounded activities from her own state.
  planning_enabled: true
  max_new_per_pass: 2
  max_live_tasks: 24
  per_kind_limit: 2
  # Budgets for scheduled work (it may run while a human is engaged).
  max_scheduled_per_wake: 2
  cycle_budget_seconds: 30.0
  task_budget_seconds: 20.0
  test_timeout_seconds: 300
  # Configured schedules. Each names a task `kind` and a `dedupe_key`.
  # Modes: daily (at HH:MM), interval (every_seconds/minutes/hours), once.
  # `timezone` is an IANA name (DST-correct). `start`/`end` bound a window;
  # `deadline`/`expires` bound lateness; `catch_up` is run|skip|coalesce.
  # Conservative defaults below: a nightly self-review, a morning digest
  # preparation, and a periodic memory-quality review.
  schedules:
    - mode: daily
      at: "03:30"
      timezone: "America/New_York"
      kind: self_review
      dedupe_key: "nightly-self-review"
      priority: 42
      catch_up: skip
      start: "02:00"
      end: "05:00"
      description: "Nightly behaviour review for recurring failures."
    - mode: daily
      at: "08:00"
      timezone: "America/New_York"
      kind: context_preparation
      dedupe_key: "morning-context"
      priority: 50
      catch_up: run
      description: "Prepare context for the day."
    - mode: interval
      every_hours: 6
      timezone: "America/New_York"
      kind: memory_review
      dedupe_key: "memory-quality"
      priority: 54
      catch_up: coalesce
      description: "Periodic memory-quality review."

# Proactive notification limits. All configurable; defaults are conservative.
notifications:
  muted: false
  paused: false
  timezone: "America/New_York"
  # At most one unsolicited standalone message per interval, and the minimum
  # gap between them.
  interval_seconds: 28800        # 8 hours
  max_per_interval: 1
  min_gap_seconds: 28800         # 8 hours
  max_per_day: 2                 # per local calendar day; a digest counts
  # Importance/relevance thresholds (0..1).
  min_importance: 0.55
  high_priority_importance: 0.85
  allow_high_priority_bypass: true
  # Quiet hours (local): no proactive messages. Wraps midnight.
  quiet_hours:
    start: "22:30"
    end: "07:30"
  # Digest: hold low-priority updates and summarise them.
  digest_enabled: true
  digest_at: "18:00"

# Adaptation to repeated non-response. Astra can initiate grounded messages; if
# several go unanswered she raises the bar for the next ones and recovers with
# time or engagement. This only ever *raises* the notification threshold - it
# never relaxes a limit, quiet hours, or a pause, and it stores no message
# content, only counters and timestamps.
engagement:
  enabled: true
  # A delivered message stays open to being counted as answered for this long.
  # A reply after this is treated as unrelated (Roum was away), not engagement.
  reply_window_seconds: 21600      # 6 hours
  # Consecutive unanswered messages before adaptation starts to bite.
  silence_after: 2
  # Extra threshold per additional unanswered message, and its cap.
  threshold_step: 0.08
  max_threshold_boost: 0.25
  # Days over which the pull decays back toward an unanswered baseline, so old
  # silence stops holding her back.
  decay_days: 3.0

filesystem:
  # Only paths under these roots may be organized. Leave empty to keep
  # autonomous file organization off until you opt in.
  allowed_roots: []
  # Paths that are never modified, on top of the runtime paths below.
  protected_paths: []
  # Extra Astra-owned paths (derived automatically from config/storage too).
  runtime_paths: []
  # Deletion routes to trash regardless; this gates the *autonomous* use of it.
  allow_delete: false
  # Overwriting/replacing an existing file requires this to be true.
  allow_overwrite: false
  # Plan without executing when true (dry-run default).
  dry_run: false
  # Files examined per organizer cycle.
  max_files_per_cycle: 40

proactive:
  # Global mute for unsolicited messages (also toggleable with /proactive).
  muted: false
  # Minimum seconds between unprompted interruptions.
  interrupt_cooldown_seconds: 1200
  # Whether a high-priority system event may bypass ordinary suppression. Only
  # ever bypasses cooldown/busy, never "user is active" or an explicit mute.
  allow_high_priority_bypass: true

voice:
  # "text" renders as text only; the interface is replaceable independently.
  renderer: text
  enabled: false

discord:
  enabled: true
  # The token is read from this environment variable, never from this file.
  bot_token_env: DISCORD_BOT_TOKEN
  # Leave empty until configuring a server.
  channel_id: "1555630373747294418"
  bot_user_id: "1555780777072136282"
  poll_seconds: 2.0
  # Inbound debounce: wait this long after the last message before answering, so
  # a thought sent in several lines is read as one turn (not answered line by
  # line). `max_batch` answers early if that many messages arrive. Six seconds
  # is deliberately unhurried: it gives a person time to finish a several-line
  # thought instead of being answered piece by piece.
  batch_seconds: 6.0
  max_batch: 8
  # Only answer a message that is actually addressed to her - an @-mention or a
  # reply to one of her messages. Otherwise she is not watching the channel and
  # stays quiet until she checks her messages or is pinged. This is the single
  # fix for "she should not perpetually pay attention to the chat".
  require_mention: true
  # Her display name, so "@Astra" also counts as addressing her (leave empty to
  # rely on the mention id and reply references only).
  bot_name: "Astra"
  # Reply at a human typing pace: the delay is words / typing_wpm minutes with a
  # little variation, delivered in bursts with small pauses. She does not paste
  # a wall of text instantly.
  typing_simulation: true
  typing_wpm: 45.0
  # Presence: how long (seconds, at a neutral state) an exchange stays open
  # before she treats Roum as having stepped away and returns to her own work.
  # Her current affect scales this - an engaged/warm state waits longer, a flat
  # or weary one gives up sooner (see astra.presence / behavior.timing_modifiers).
  presence_base_patience: 300.0
  # Optional low-frequency autonomous check: even without a ping, look at the
  # channel once per check_interval_seconds and answer. 0 = never (she relies on
  # being pinged or told to check). Set e.g. 1800 for a check every 30 minutes.
  check_on_cycle: false
  check_interval_seconds: 0
  # Optional: restrict who may be answered (Discord user ids). Empty = any
  # non-bot author in the channel.
  allowed_author_ids: []
